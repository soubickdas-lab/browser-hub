name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: ui/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: ui/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          app="dist/win-unpacked/Browser Hub.exe"
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | ELECTRON_RUN_AS_NODE=1 "$app" dist/win-unpacked/resources/hub/local-hub.js)
          echo "$out"; echo "$out" | grep -q browser-hub-local
          "$app" --hidden >/dev/null 2>&1 &
          sleep 15
          curl -sf http://127.0.0.1:8777/health | tee /dev/stderr | grep -q '"ok":true'
      - name: Smoke test (Mac, from the dmg)
        if: runner.os == 'macOS'
        run: |
          for dmg in dist/*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
            codesign --verify --deep --strict --verbose=2 "$mnt/Browser Hub.app"
            hdiutil detach "$mnt"
          done
          mnt=$(mktemp -d)
          hdiutil attach dist/*-arm64.dmg -nobrowse -readonly -mountpoint "$mnt"
          cp -R "$mnt/Browser Hub.app" /Applications/
          hdiutil detach "$mnt"
          app="/Applications/Browser Hub.app"
          out=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Browser Hub" "$app/Contents/Resources/hub/local-hub.js")
          echo "$out"; echo "$out" | grep -q browser-hub-local
          open "$app" --args --hidden; sleep 15
          curl -sf http://127.0.0.1:8777/health | tee /dev/stderr | grep -q '"ok":true'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Windows:** download `Browser-Hub-Setup-*.exe` and run it.
            **Mac:** download the `.dmg` for your chip (`arm64` = Apple Silicon M1/M2/M3/M4, `x64` = Intel), open it, drag Browser Hub into Applications.
            First launch on Mac: right-click Browser Hub -> Open (the app is not notarised). On macOS 15+, if it is still blocked: System Settings -> Privacy & Security -> Open Anyway.

            Then in the app: **Connect Claude**, and load the extension (Open extension folder) in each Chrome.
