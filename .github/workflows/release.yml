name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: ui/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: ui/dist/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            **Windows:** download `Browser-Hub-Setup-*.exe` and run it.
            **Mac:** download the `.dmg` for your chip (`arm64` = Apple Silicon M1/M2/M3/M4, `x64` = Intel), open it, drag Browser Hub into Applications.
            First launch on Mac: right-click Browser Hub -> Open (the app is not notarised). On macOS 15+, if it is still blocked: System Settings -> Privacy & Security -> Open Anyway.

            Then in the app: **Connect Claude**, and load the extension (Open extension folder) in each Chrome.
